[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optris-alert-daemon"
version = "0.1.0"
description = "Monitor Optris PIX Connect alarms and send Gmail alerts."
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
